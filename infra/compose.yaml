name: just-go-local

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-justgo}
      POSTGRES_USER: ${POSTGRES_USER:-justgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    profiles: ["app"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: just-go-backend:local
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-justgo}
      DB_USERNAME: ${POSTGRES_USER:-justgo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
      TMAP_APP_KEY: ${TMAP_APP_KEY:-}
      TMAP_DAILY_CALL_LIMIT: ${TMAP_DAILY_CALL_LIMIT:-90}
      PARK_API_KEY: ${PARK_API_KEY:-}
      PARK_API_URL: ${PARK_API_URL:-https://api.data.go.kr/openapi/tn_pubr_public_cty_park_info_api}
      TOUR_API_KEY: ${TOUR_API_KEY:-}
      TOUR_API_URL: ${TOUR_API_URL:-https://apis.data.go.kr/B551011/KorService2/locationBasedList2}
      PARK_CACHE_TTL: ${PARK_CACHE_TTL:-6h}
      # 컨테이너 내부에서는 모든 인터페이스로 듣되 호스트 공개는 아래 loopback 포트로 제한합니다.
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
