name: just-go-local

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-justgo}
      POSTGRES_USER: ${POSTGRES_USER:-justgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    profiles: ["app"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: just-go-backend:local
    # API 키는 한 곳(backend/.env)에서만 관리한다. 파일이 없는 환경에서도
    # Compose 구성을 조회하거나 PostgreSQL만 실행할 수 있도록 optional로 둔다.
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local,public-data,tmap}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-justgo}
      DB_USERNAME: ${POSTGRES_USER:-justgo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
      # 컨테이너 내부에서는 모든 인터페이스로 듣되 호스트 공개는 아래 loopback 포트로 제한합니다.
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
