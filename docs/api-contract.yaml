openapi: 3.1.0
info:
  title: just go backend API
  version: 0.1.0-draft
  description: >-
    브라우저와 백엔드 연결 검증을 위한 추천 요청 초안입니다. mock=true 또는
    mode=MOCK인 응답은 실제 도로·시간·거리 데이터가 아닙니다. 외부 경로 제공자는
    아직 확정하거나 연결하지 않았습니다.
paths:
  /api/v1/spots:
    get:
      summary: 검수 완료 경관 장소 후보 조회
      description: >-
        지정한 풍경 테마에서 활성 상태이고 WGS84 좌표가 등록된 VERIFIED 장소만
        식별자 순으로 조회합니다. 실제 장소 데이터는 별도 수동 검수 후 등록합니다.
      operationId: findVerifiedSpotCandidates
      parameters:
        - name: theme
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ScenicTheme'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: 검수 완료 장소 후보 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotCandidateListResponse'
        '400':
          description: 테마 또는 조회 개수 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/routes/recommendations:
    post:
      summary: 주행 조건으로 코스 추천 요청
      description: >-
        WGS84 출발 좌표, 희망 주행 시간, 풍경 테마를 받습니다. mock 프로필에서는
        UI/API 연결 검증용 예시를 반환하고 일반 프로필에서는 빈 결과와
        UNAVAILABLE 상태를 반환합니다.
      operationId: recommendRoutes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRecommendationRequest'
      responses:
        '200':
          description: 추천 결과 또는 제공자 미연동 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteRecommendationResponse'
        '400':
          description: 입력값 또는 JSON 형식 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
components:
  schemas:
    SpotCandidateListResponse:
      type: object
      required: [theme, count, spots]
      properties:
        theme:
          $ref: '#/components/schemas/ScenicTheme'
        count:
          type: integer
          minimum: 0
        spots:
          type: array
          items:
            $ref: '#/components/schemas/SpotCandidateResponse'
    SpotCandidateResponse:
      type: object
      required: [id, name, theme, latitude, longitude]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        theme:
          $ref: '#/components/schemas/ScenicTheme'
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: WGS84 위도
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: WGS84 경도
    RouteRecommendationRequest:
      type: object
      required: [latitude, longitude, desiredMinutes, theme]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: WGS84 위도. 개발 시 실제 개인 위치 대신 테스트 좌표를 사용합니다.
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: WGS84 경도. 개발 시 실제 개인 위치 대신 테스트 좌표를 사용합니다.
        desiredMinutes:
          type: integer
          enum: [30, 60, 90, 120]
          description: 희망 주행 시간(분)
        theme:
          $ref: '#/components/schemas/ScenicTheme'
    RouteRecommendationResponse:
      type: object
      required: [mode, mock, routes, notice]
      properties:
        mode:
          type: string
          enum: [MOCK, UNAVAILABLE]
        mock:
          type: boolean
          description: true이면 실제 경로 데이터가 아닌 개발용 예시입니다.
        routes:
          type: array
          items:
            $ref: '#/components/schemas/RouteRecommendationItem'
        notice:
          type: string
    RouteRecommendationItem:
      type: object
      required: [routeId, title, estimatedMinutes, distanceMeters, theme, reason]
      properties:
        routeId:
          type: string
        title:
          type: string
        estimatedMinutes:
          type: integer
          minimum: 0
        distanceMeters:
          type: integer
          format: int64
          minimum: 0
        theme:
          $ref: '#/components/schemas/ScenicTheme'
        reason:
          type: string
    ScenicTheme:
      type: string
      enum: [CITY, MOUNTAIN, RIVER, LAKE, SEA]
    ApiErrorResponse:
      type: object
      required: [code, message, fieldErrors]
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
