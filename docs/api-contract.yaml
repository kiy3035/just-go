openapi: 3.1.0
info:
  title: just go backend API
  version: 0.9.0-draft
  description: >-
    브라우저와 백엔드 연결 검증을 위한 추천 요청 초안입니다. mock=true 또는
    mode=MOCK인 응답은 실제 도로·시간·거리 데이터가 아닙니다. tmap 프로필의
    mode=LIVE 응답만 TMAP 시간·거리·왕복 선형 분석 결과이며 실제 앱 키 호출은 아직 미검증입니다.
paths:
  /api/v1/spots:
    get:
      summary: 검수 완료 경관 장소 후보 조회
      description: >-
        지정한 풍경 테마에서 활성 상태이고 WGS84 좌표·출처·품질 검수를 마친
        VERIFIED 장소만 품질 합계가 높은 순으로 조회합니다. 실제 장소 데이터는
        별도 수동 검수 후 등록합니다.
      operationId: findVerifiedSpotCandidates
      parameters:
        - name: theme
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ScenicTheme'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: 검수 완료 장소 후보 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotCandidateListResponse'
        '400':
          description: 테마 또는 조회 개수 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/routes/recommendations:
    post:
      summary: 주행 조건으로 코스 추천 요청
      description: >-
        WGS84 출발 좌표, 희망 주행 시간, 왕복·편도 방식, 풍경 테마를 받습니다.
        mock 프로필에서는 UI/API 연결 검증용 예시를 반환하고, tmap 프로필에서는
        출발지·희망 시간·주행 방식으로 계산한 보수적인 직선거리 상한 안의 검수 후보 중
        최대 3개의 TMAP 시간·거리와 왕복 선형 중복률을 계산합니다. 왕복은 후보를 경유해
        출발지로 돌아오며 편도는 후보에서 종료합니다. 두 프로필이 없으면 빈 결과와
        UNAVAILABLE 상태를 반환합니다. LIVE 후보는 희망 시간 ±15% 안의 경로만
        시간 차이, 왕복 중복률, 거리, 경로 ID 순으로 정렬해 최대 3개 반환합니다. 일치 후보가
        없으면 가짜 대체 코스 없이 빈 목록과 조건 변경 안내를 반환합니다. 선택한
        풍경에 검수 후보가 전혀 없으면 후보가 실제 존재하는 다른 풍경을 최대 3개
        재검색 조건으로 제안합니다.
      operationId: recommendRoutes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRecommendationRequest'
      responses:
        '200':
          description: 추천 결과 또는 제공자 미연동 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteRecommendationResponse'
        '400':
          description: 입력값 또는 JSON 형식 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '502':
          description: 외부 경로 제공자의 네트워크·응답·입력 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: 외부 경로 제공자의 인증 또는 호출 한도 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
components:
  schemas:
    SpotCandidateListResponse:
      type: object
      required: [theme, count, spots]
      properties:
        theme:
          $ref: '#/components/schemas/ScenicTheme'
        count:
          type: integer
          minimum: 0
        spots:
          type: array
          items:
            $ref: '#/components/schemas/SpotCandidateResponse'
    SpotCandidateResponse:
      type: object
      required: [id, name, theme, latitude, longitude]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        theme:
          $ref: '#/components/schemas/ScenicTheme'
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: WGS84 위도
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: WGS84 경도
    RouteRecommendationRequest:
      type: object
      required: [latitude, longitude, desiredMinutes, tripType, theme]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: WGS84 위도. 개발 시 실제 개인 위치 대신 테스트 좌표를 사용합니다.
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: WGS84 경도. 개발 시 실제 개인 위치 대신 테스트 좌표를 사용합니다.
        desiredMinutes:
          type: integer
          minimum: 10
          maximum: 240
          multipleOf: 5
          description: 희망 주행 시간(분). 10~240분·5분 단위는 임시 개발 기준입니다.
        tripType:
          $ref: '#/components/schemas/TripType'
        theme:
          $ref: '#/components/schemas/ScenicTheme'
    RouteRecommendationResponse:
      type: object
      required: [mode, mock, routes, suggestions, notice]
      properties:
        mode:
          type: string
          enum: [MOCK, LIVE, UNAVAILABLE]
        mock:
          type: boolean
          description: true이면 실제 경로 데이터가 아닌 개발용 예시입니다.
        routes:
          type: array
          items:
            $ref: '#/components/schemas/RouteRecommendationItem'
        suggestions:
          type: array
          description: >-
            LIVE 계산 후보가 있지만 희망 시간 ±15%에 맞는 코스가 없을 때는 실제
            후보 시간에 가까운 조건을 반환합니다. 선택 풍경에 검수 후보가 없을 때는
            후보가 존재하는 다른 풍경을 최대 3개 반환합니다. 제안은 경로나 성공
            결과가 아니며 다시 검색해야 합니다. 그 밖의 응답에서는 빈 배열입니다.
          items:
            $ref: '#/components/schemas/RouteConditionSuggestion'
        notice:
          type: string
    RouteConditionSuggestion:
      type: object
      required: [desiredMinutes, tripType, theme, reason]
      properties:
        desiredMinutes:
          type: integer
          minimum: 10
          maximum: 240
          multipleOf: 5
        tripType:
          $ref: '#/components/schemas/TripType'
        theme:
          $ref: '#/components/schemas/ScenicTheme'
        reason:
          type: string
    RouteRecommendationItem:
      type: object
      required: [routeId, title, estimatedMinutes, distanceMeters, theme, stops, reason]
      properties:
        routeId:
          type: string
        title:
          type: string
        estimatedMinutes:
          type: integer
          minimum: 0
        distanceMeters:
          type: integer
          format: int64
          minimum: 0
        theme:
          $ref: '#/components/schemas/ScenicTheme'
        repeatedSegmentPercent:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: >-
            TMAP GeoJSON 선형에서 최초 통과 이후 같은 선분을 다시 지난 거리의 비율입니다.
            현재 왕복 LIVE 결과에서만 계산하며 편도·MOCK·형상 없는 응답은 null입니다.
        stops:
          type: array
          description: >-
            차량 내비게이션에 순서대로 전달할 WGS84 지점입니다. 왕복은 경관
            WAYPOINT 다음 출발지 복귀 DESTINATION, 편도는 경관 DESTINATION 한 건을
            반환합니다. MOCK 응답은 가짜 좌표를 만들지 않고 빈 배열을 반환합니다.
          items:
            $ref: '#/components/schemas/RouteRecommendationStop'
        reason:
          type: string
    RouteRecommendationStop:
      type: object
      required: [sequence, type, name, latitude, longitude]
      properties:
        sequence:
          type: integer
          minimum: 1
        type:
          type: string
          enum: [WAYPOINT, DESTINATION]
        name:
          type: string
          minLength: 1
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: WGS84 위도
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: WGS84 경도
    ScenicTheme:
      type: string
      enum: [CITY, MOUNTAIN, RIVER, LAKE, SEA]
    TripType:
      type: string
      enum: [ROUND_TRIP, ONE_WAY]
      description: ROUND_TRIP은 출발지 복귀, ONE_WAY는 다른 지점에서 종료합니다.
    ApiErrorResponse:
      type: object
      required: [code, message, fieldErrors]
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
