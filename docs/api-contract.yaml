openapi: 3.1.0
info:
  title: just go backend API
  version: 0.13.0-draft
  description: >-
    브라우저와 백엔드 연결 검증을 위한 추천 요청 초안입니다. mock=true 또는
    mode=MOCK인 응답은 실제 도로·시간·거리 데이터가 아닙니다. tmap 프로필의
    mode=LIVE 응답만 TMAP 시간·거리·왕복 선형 분석 결과입니다. 2026-11-07
    Free TMAP 상품 활성화 후 실제 일반 자동차 경로와 다중 경유지 왕복 경로의
    LIVE 처리 및 실제 계산 시간 기반 대체 조건 응답을 검증했습니다.
paths:
  /api/v1/spots:
    get:
      summary: 검수 완료 경관 장소 후보 조회
      description: >-
        지정한 풍경 테마에서 활성 상태이고 WGS84 좌표·출처·품질 검수를 마친
        VERIFIED 장소만 품질 합계가 높은 순으로 조회합니다. 서울·수도권 초기 후보
        13건은 Git 제외 로컬 파일로 준비했으며 실제 주행·경관 최종 검수는 남아 있습니다.
      operationId: findVerifiedSpotCandidates
      parameters:
        - name: theme
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ScenicTheme'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: 검수 완료 장소 후보 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotCandidateListResponse'
        '400':
          description: 테마 또는 조회 개수 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/routes/recommendations:
    post:
      summary: 주행 조건으로 코스 추천 요청
      description: >-
        WGS84 출발 좌표, 희망 주행 시간, 왕복·편도 방식, 풍경 테마와 선택적인
        30분 유효 장소 후보 토큰을 받습니다. 후보 토큰이 있으면 그 장소 한 곳만
        실제 경로로 계산하고, 없으면 기존 자동 추천 흐름을 사용합니다.
        mock 프로필에서는 UI/API 연결 검증용 예시를 반환하고, tmap 프로필에서는
        출발지·희망 시간·주행 방식으로 계산한 보수적인 직선거리 상한 안의 검수 후보 중
        상위 두 곳의 단일 경로 2건과 두 곳을 잇는 조합 경로 1건까지 TMAP 시간·거리와
        왕복 선형 중복률을 계산합니다. 왕복은 한두 후보를 경유해 출발지로 돌아오며
        편도 조합은 첫 후보를 경유해 마지막 후보에서 종료합니다. 두 프로필이 없으면 빈 결과와
        UNAVAILABLE 상태를 반환합니다. 실제 계산된 LIVE 후보는 희망 시간과 차이가
        크더라도 숨기지 않고 시간 차이, 왕복 중복률, 거리, 경로 ID 순으로 정렬해
        최대 3개 반환합니다. 선택한
        풍경에 검수 후보가 전혀 없으면 후보가 실제 존재하는 다른 풍경을 최대 3개
        재검색 조건으로 제안합니다. 일부 후보 계산 후 일일 호출 한도가 소진되면
        이미 계산한 LIVE 경로만 보존해 반환하고 추가 외부 호출을 중단합니다.
      operationId: recommendRoutes
      security:
        - RouteApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRecommendationRequest'
      responses:
        '200':
          description: 추천 결과 또는 제공자 미연동 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteRecommendationResponse'
        '400':
          description: 입력값 또는 JSON 형식 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: 공개 환경의 추천 API 접근 토큰 누락 또는 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '413':
          description: 추천 요청 본문 크기 제한 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: 클라이언트별 분당 제한 또는 서버 동시 추천 처리 제한 초과
          headers:
            Retry-After:
              schema:
                type: integer
              description: 다시 시도하기 전 대기할 초 단위 시간
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '502':
          description: 외부 경로 제공자의 네트워크·응답·입력 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: 외부 경로 제공자의 인증 또는 호출 한도 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/places/candidates:
    get:
      summary: 경로 계산 전 넓은 장소 후보 조회
      description: >-
        검수 DB와 public-data 프로필의 전국도시공원정보·TourAPI 후보를 합쳐
        직선거리 범위 안에서 최대 50건 반환합니다. 후보 조회만으로 TMAP 경로를
        계산하지 않습니다. candidateToken은 서버 메모리에만 30분 보관되며
        경로 추천 요청에 선택적으로 전달할 수 있습니다. 출발 좌표는 저장하지 않습니다.
      operationId: findCandidatePlaces
      security:
        - RouteApiToken: []
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: desiredMinutes
          in: query
          required: true
          schema:
            type: integer
            minimum: 10
            maximum: 240
            multipleOf: 5
        - name: tripType
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/TripType'
        - name: theme
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ScenicTheme'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: 단기 선택 토큰이 포함된 장소 후보 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidatePlaceListResponse'
        '400':
          description: 좌표·시간·테마·조회 개수 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: 공개 환경의 API 접근 토큰 누락 또는 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: 클라이언트별 분당 제한 또는 서버 동시 처리 제한 초과
          headers:
            Retry-After:
              schema:
                type: integer
              description: 다시 시도하기 전 대기할 초 단위 시간
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
components:
  securitySchemes:
    RouteApiToken:
      type: apiKey
      in: header
      name: X-Just-Go-Client-Token
      description: >-
        공개 production 환경에서만 필수인 TMAP 키와 별개의 교체 가능한 접근 토큰입니다.
        저장소·로그·URL에 넣지 않습니다.
  schemas:
    SpotCandidateListResponse:
      type: object
      required: [theme, count, spots]
      properties:
        theme:
          $ref: '#/components/schemas/ScenicTheme'
        count:
          type: integer
          minimum: 0
        spots:
          type: array
          items:
            $ref: '#/components/schemas/SpotCandidateResponse'
    CandidatePlaceListResponse:
      type: object
      required: [theme, count, tokenExpiresInMinutes, candidates]
      properties:
        theme:
          $ref: '#/components/schemas/ScenicTheme'
        count:
          type: integer
          minimum: 0
          maximum: 50
        tokenExpiresInMinutes:
          type: integer
          enum: [30]
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/CandidatePlaceResponse'
    CandidatePlaceResponse:
      type: object
      required: [candidateToken, name, theme, latitude, longitude, straightLineDistanceMeters, source]
      properties:
        candidateToken:
          type: string
          format: uuid
        name:
          type: string
        theme:
          $ref: '#/components/schemas/ScenicTheme'
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        straightLineDistanceMeters:
          type: integer
          format: int64
          minimum: 0
          description: 후보 축소·정렬용 직선거리이며 실제 자동차 경로 거리가 아닙니다.
        source:
          type: string
          enum: [VERIFIED_DB, PUBLIC_PARK, TOUR_API]
    SpotCandidateResponse:
      type: object
      required: [id, name, theme, latitude, longitude]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        theme:
          $ref: '#/components/schemas/ScenicTheme'
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: WGS84 위도
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: WGS84 경도
    RouteRecommendationRequest:
      type: object
      required: [latitude, longitude, desiredMinutes, tripType, theme]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: WGS84 위도. 개발 시 실제 개인 위치 대신 테스트 좌표를 사용합니다.
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: WGS84 경도. 개발 시 실제 개인 위치 대신 테스트 좌표를 사용합니다.
        desiredMinutes:
          type: integer
          minimum: 10
          maximum: 240
          multipleOf: 5
          description: 희망 주행 시간(분). 10~240분·5분 단위는 임시 개발 기준입니다.
        tripType:
          $ref: '#/components/schemas/TripType'
        theme:
          $ref: '#/components/schemas/ScenicTheme'
        candidateToken:
          type: string
          format: uuid
          description: >-
            GET /api/v1/places/candidates에서 받은 30분 유효 선택 토큰입니다.
            생략하면 기존 자동 추천 후보를 사용합니다.
    RouteRecommendationResponse:
      type: object
      required: [mode, mock, routes, suggestions, notice]
      properties:
        mode:
          type: string
          enum: [MOCK, LIVE, UNAVAILABLE]
        mock:
          type: boolean
          description: true이면 실제 경로 데이터가 아닌 개발용 예시입니다.
        routes:
          type: array
          items:
            $ref: '#/components/schemas/RouteRecommendationItem'
        suggestions:
          type: array
          description: >-
            선택 풍경에 검수 후보가 없을 때 후보가 존재하는 다른 풍경을 최대 3개
            반환합니다. 제안은 경로나 성공 결과가 아니며 다시 검색해야 합니다.
            그 밖의 응답에서는 빈 배열입니다.
          items:
            $ref: '#/components/schemas/RouteConditionSuggestion'
        notice:
          type: string
    RouteConditionSuggestion:
      type: object
      required: [desiredMinutes, tripType, theme, reason]
      properties:
        desiredMinutes:
          type: integer
          minimum: 10
          maximum: 240
          multipleOf: 5
        tripType:
          $ref: '#/components/schemas/TripType'
        theme:
          $ref: '#/components/schemas/ScenicTheme'
        reason:
          type: string
    RouteRecommendationItem:
      type: object
      required: [routeId, title, estimatedMinutes, distanceMeters, theme, stops, reason]
      properties:
        routeId:
          type: string
        title:
          type: string
        estimatedMinutes:
          type: integer
          minimum: 0
        distanceMeters:
          type: integer
          format: int64
          minimum: 0
        theme:
          $ref: '#/components/schemas/ScenicTheme'
        repeatedSegmentPercent:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: >-
            TMAP GeoJSON 선형에서 최초 통과 이후 같은 선분을 다시 지난 거리의 비율입니다.
            현재 왕복 LIVE 결과에서만 계산하며 편도·MOCK·형상 없는 응답은 null입니다.
        stops:
          type: array
          description: >-
            차량 내비게이션에 순서대로 전달할 WGS84 지점입니다. 왕복은 경관
            WAYPOINT 다음 출발지 복귀 DESTINATION, 편도는 경관 DESTINATION 한 건을
            반환합니다. MOCK 응답은 가짜 좌표를 만들지 않고 빈 배열을 반환합니다.
          items:
            $ref: '#/components/schemas/RouteRecommendationStop'
        reason:
          type: string
    RouteRecommendationStop:
      type: object
      required: [sequence, type, name, latitude, longitude]
      properties:
        sequence:
          type: integer
          minimum: 1
        type:
          type: string
          enum: [WAYPOINT, DESTINATION]
        name:
          type: string
          minLength: 1
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: WGS84 위도
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: WGS84 경도
    ScenicTheme:
      type: string
      enum: [CITY, MOUNTAIN, RIVER, LAKE, SEA, PARK, ANYWHERE, WATER]
      description: >-
        화면의 6개 선택은 ANYWHERE(어디든), CITY(도시), MOUNTAIN(산), SEA(바다),
        WATER(강/호수), PARK(공원)입니다. ANYWHERE는 전체 실제 테마 후보를,
        WATER는 RIVER와 LAKE 후보를 함께 조회합니다. 기존 RIVER/LAKE 요청도 지원합니다.
        공원 검수 후보가 없으면 빈 결과를 반환하며 다른 테마로 대체하지 않습니다.
    TripType:
      type: string
      enum: [ROUND_TRIP, ONE_WAY]
      description: ROUND_TRIP은 출발지 복귀, ONE_WAY는 다른 지점에서 종료합니다.
    ApiErrorResponse:
      type: object
      required: [code, message, fieldErrors]
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
