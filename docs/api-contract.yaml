openapi: 3.1.0
info:
  title: just go backend API
  version: 0.13.0-draft
  description: >-
    브라우저와 백엔드 연결 검증을 위한 추천 요청 초안입니다. mock=true 또는
    mode=MOCK인 응답은 실제 도로·시간·거리 데이터가 아닙니다. tmap 프로필의
    mode=LIVE 응답만 TMAP 시간·거리·왕복 선형 분석 결과입니다. 2026-11-07
    Free TMAP 상품 활성화 후 실제 일반 자동차 경로와 다중 경유지 왕복 경로의
    LIVE 처리 및 실제 계산 시간 기반 대체 조건 응답을 검증했습니다.
paths:
  /api/v1/spots:
    get:
      summary: 검수 완료 경관 장소 후보 조회
      description: >-
        지정한 풍경 테마에서 활성 상태이고 WGS84 좌표·출처·품질 검수를 마친
        VERIFIED 장소만 품질 합계가 높은 순으로 조회합니다. 서울·수도권 초기 후보
        13건은 Git 제외 로컬 파일로 준비했으며 실제 주행·경관 최종 검수는 남아 있습니다.
      operationId: findVerifiedSpotCandidates
      parameters:
        - name: theme
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ScenicTheme'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: 검수 완료 장소 후보 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotCandidateListResponse'
        '400':
          description: 테마 또는 조회 개수 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/routes/recommendations:
    post:
      summary: 주행 조건으로 코스 추천 요청
      description: >-
        WGS84 출발 좌표, 희망 주행 시간, 왕복·편도 방식, 풍경 테마와 선택적인
        30분 유효 장소 후보 토큰을 받습니다. 후보 토큰이 있으면 그 장소 한 곳만
        실제 경로로 계산합니다. 토큰이 없으면 직선거리 검색 반경을 단계적으로 넓혀 후보를 확보한 뒤
        TMAP 자동차 경로를 목적지별로 계산합니다. 왕복은 가는 길과 복귀 길의 시간·거리를 합산합니다.
        목표 시간과의 초 단위 절대 차이 순으로 최대 10개를 반환합니다. 도시는 예상 도착 때 관람 가능한
        행사 그룹을 먼저 표시하고, 행사와 일반 명소 각 그룹에서 목표 시간 차이를 비교합니다.
        확인된 코스가 10개보다 적으면 확보된 수만 반환합니다. 원래 테마에서 유효 경로가 없으면
        계산에 성공한 다른 테마의 경로를 별도로 반환할 수 있습니다.
        mock 프로필에서는 명시적인 MOCK 응답을, 경로 제공자가 없으면 UNAVAILABLE을 반환합니다.
        일부 후보 계산 후 일일 호출 한도가 소진되면
        이미 계산한 LIVE 경로만 보존해 반환하고 추가 외부 호출을 중단합니다.
      operationId: recommendRoutes
      security:
        - RouteApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRecommendationRequest'
      responses:
        '200':
          description: 추천 결과 또는 제공자 미연동 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteRecommendationResponse'
        '400':
          description: 입력값 또는 JSON 형식 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: 공개 환경의 추천 API 접근 토큰 누락 또는 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '413':
          description: 추천 요청 본문 크기 제한 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: 클라이언트별 분당 제한 또는 서버 동시 추천 처리 제한 초과
          headers:
            Retry-After:
              schema:
                type: integer
              description: 다시 시도하기 전 대기할 초 단위 시간
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '502':
          description: 자동차 경로 제공자 또는 장소 후보 원천의 조회 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: 외부 경로 제공자의 인증 또는 호출 한도 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/places/candidates:
    get:
      summary: 경로 계산 전 넓은 장소 후보 조회
      description: >-
        검수 DB와 public-data 프로필의 전국도시공원정보·TourAPI, TMAP POI 후보를 합쳐
        직선거리 범위 안에서 최대 50건 반환합니다. 후보 조회만으로 TMAP 경로를
        계산하지 않습니다. candidateToken은 서버 메모리에만 30분 보관되며
        경로 추천 요청에 선택적으로 전달할 수 있습니다. 출발 좌표는 저장하지 않습니다.
        일부 외부 원천이 실패해도 정상 원천의 후보를 반환하며 partial과
        unavailableSources로 부분 성공 상태를 알립니다.
      operationId: findCandidatePlaces
      security:
        - RouteApiToken: []
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: desiredMinutes
          in: query
          required: true
          schema:
            type: integer
            minimum: 10
            maximum: 240
            multipleOf: 5
        - name: tripType
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/TripType'
        - name: theme
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ScenicTheme'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: 단기 선택 토큰이 포함된 장소 후보 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidatePlaceListResponse'
        '400':
          description: 좌표·시간·테마·조회 개수 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: 공개 환경의 API 접근 토큰 누락 또는 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: 클라이언트별 분당 제한 또는 서버 동시 처리 제한 초과
          headers:
            Retry-After:
              schema:
                type: integer
              description: 다시 시도하기 전 대기할 초 단위 시간
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
components:
  securitySchemes:
    RouteApiToken:
      type: apiKey
      in: header
      name: X-Just-Go-Client-Token
      description: >-
        공개 production 환경에서만 필수인 TMAP 키와 별개의 교체 가능한 접근 토큰입니다.
        저장소·로그·URL에 넣지 않습니다.
  schemas:
    SpotCandidateListResponse:
      type: object
      required: [theme, count, spots]
      properties:
        theme:
          $ref: '#/components/schemas/ScenicTheme'
        count:
          type: integer
          minimum: 0
        spots:
          type: array
          items:
            $ref: '#/components/schemas/SpotCandidateResponse'
    CandidatePlaceListResponse:
      type: object
      required: [theme, count, tokenExpiresInMinutes, partial, unavailableSources, candidates]
      properties:
        theme:
          $ref: '#/components/schemas/ScenicTheme'
        count:
          type: integer
          minimum: 0
          maximum: 50
        tokenExpiresInMinutes:
          type: integer
          enum: [30]
        partial:
          type: boolean
          description: true이면 일부 외부 후보 원천이 실패했지만 정상 원천의 후보는 반환된 상태입니다.
        unavailableSources:
          type: array
          description: 이번 조회에서 실패한 외부 후보 원천 이름입니다. 완전 성공이면 빈 배열입니다.
          items:
            type: string
            enum: [PUBLIC_PARK, TOUR_API, TMAP_POI]
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/CandidatePlaceResponse'
    CandidatePlaceResponse:
      type: object
      required: [candidateToken, name, theme, latitude, longitude, straightLineDistanceMeters, source, sourceCategory]
      properties:
        candidateToken:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        theme:
          $ref: '#/components/schemas/ScenicTheme'
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        straightLineDistanceMeters:
          type: integer
          format: int64
          minimum: 0
          description: 후보 축소·정렬용 직선거리이며 실제 자동차 경로 거리가 아닙니다.
        source:
          type: string
          enum: [VERIFIED_DB, PUBLIC_PARK, TOUR_API, TMAP_POI]
        sourceCategory:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            원천이 제공한 공식 분류값입니다. 화면 테마는 이 값을 명시적 매핑한 결과이며
            장소명 키워드로 재분류하지 않습니다.
    SpotCandidateResponse:
      type: object
      required: [id, name, theme, latitude, longitude]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        theme:
          $ref: '#/components/schemas/ScenicTheme'
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: WGS84 위도
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: WGS84 경도
    RouteRecommendationRequest:
      type: object
      required: [latitude, longitude, desiredMinutes, tripType, theme]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: WGS84 위도. 개발 시 실제 개인 위치 대신 테스트 좌표를 사용합니다.
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: WGS84 경도. 개발 시 실제 개인 위치 대신 테스트 좌표를 사용합니다.
        desiredMinutes:
          type: integer
          minimum: 10
          maximum: 240
          multipleOf: 5
          description: 희망 주행 시간(분). 10~240분·5분 단위는 임시 개발 기준입니다.
        tripType:
          $ref: '#/components/schemas/TripType'
        theme:
          $ref: '#/components/schemas/ScenicTheme'
        candidateToken:
          type: string
          format: uuid
          description: >-
            GET /api/v1/places/candidates에서 받은 30분 유효 선택 토큰입니다.
            생략하면 기존 자동 추천 후보를 사용합니다.
    RouteRecommendationResponse:
      type: object
      required: [mode, mock, routes, suggestions, notice]
      properties:
        mode:
          type: string
          enum: [MOCK, LIVE, UNAVAILABLE]
        mock:
          type: boolean
          description: true이면 실제 경로 데이터가 아닌 개발용 예시입니다.
        routes:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/RouteRecommendationItem'
        alternativeRoutes:
          type: array
          maxItems: 5
          description: >-
            선택한 풍경에서 경로를 찾지 못한 LIVE 요청에 호출 예산이 남아 있으면
            같은 출발지·희망 시간·주행 방식으로 다른 풍경의 도로 경로를 계산합니다.
            계산에 성공한 코스만 담으며, 없으면 빈 배열입니다.
          items:
            $ref: '#/components/schemas/RouteRecommendationItem'
        suggestions:
          type: array
          deprecated: true
          description: 이전 클라이언트 호환용 필드입니다. 항상 빈 배열입니다.
          items:
            $ref: '#/components/schemas/RouteConditionSuggestion'
        notice:
          type: string
    RouteConditionSuggestion:
      type: object
      required: [desiredMinutes, tripType, theme, reason]
      properties:
        desiredMinutes:
          type: integer
          minimum: 10
          maximum: 240
          multipleOf: 5
        tripType:
          $ref: '#/components/schemas/TripType'
        theme:
          $ref: '#/components/schemas/ScenicTheme'
        reason:
          type: string
    RouteRecommendationItem:
      type: object
      required: [routeId, title, estimatedMinutes, distanceMeters, theme, stops, reason]
      properties:
        routeId:
          type: string
        title:
          type: string
        estimatedMinutes:
          type: integer
          minimum: 0
          description: durationSeconds를 분 단위로 올림한 표시 시간입니다.
        durationSeconds:
          type: integer
          format: int64
          minimum: 0
          description: 목표 시간과 비교할 때 사용하는 예상 주행시간(초)입니다.
        distanceMeters:
          type: integer
          format: int64
          minimum: 0
        theme:
          $ref: '#/components/schemas/ScenicTheme'
        repeatedSegmentPercent:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: >-
            TMAP GeoJSON 선형에서 최초 통과 이후 같은 선분을 다시 지난 거리의 비율입니다.
            이전 토큰 기반 왕복에서 형상을 분석할 수 있을 때만 제공합니다.
        stops:
          type: array
          maxItems: 3
          description: >-
            차량 내비게이션에 순서대로 전달할 WGS84 지점입니다. 왕복은 경관
            WAYPOINT 다음 출발지 복귀 DESTINATION, 편도는 경관 DESTINATION 한 건을
            반환하며 NaviHelper가 지원하는 최대 2개 경유지와 목적지 1개를 넘지 않습니다.
            MOCK 응답은 가짜 좌표를 만들지 않고 빈 배열을 반환합니다.
          items:
            $ref: '#/components/schemas/RouteRecommendationStop'
        reason:
          type: string
        legSeconds:
          type: array
          description: >-
            출발지부터 stops 순서대로 각 도로 구간의 TMAP 예상시간(초)입니다.
            값이 있으면 stops와 개수가 같고 합계가 durationSeconds와 일치합니다.
            구간을 제공하지 않는 응답은 빈 배열입니다.
          items:
            type: integer
            format: int64
            minimum: 1
        event:
          type: [object, 'null']
          description: 예상 도착 시각에 관람 가능한 도시 행사에만 제공됩니다.
          required: [name, venue, opensAt, closesAt, arrivesAt]
          properties:
            name:
              type: string
            venue:
              type: string
            opensAt:
              type: string
              format: date-time
            closesAt:
              type: string
              format: date-time
            arrivesAt:
              type: string
              format: date-time
    RouteRecommendationStop:
      type: object
      required: [sequence, type, name, latitude, longitude]
      properties:
        sequence:
          type: integer
          minimum: 1
        type:
          type: string
          enum: [WAYPOINT, DESTINATION]
        name:
          type: string
          minLength: 1
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: WGS84 위도
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: WGS84 경도
    ScenicTheme:
      type: string
      enum: [CITY, MOUNTAIN, RIVER, LAKE, SEA, PARK, ANYWHERE, WATER]
      description: >-
        화면의 6개 선택은 ANYWHERE(어디든), CITY(도시), MOUNTAIN(산), SEA(바다),
        WATER(강/호수), PARK(공원)입니다. ANYWHERE는 전체 실제 테마 후보를,
        WATER는 RIVER와 LAKE 후보를 함께 조회합니다. 기존 RIVER/LAKE 요청도 지원합니다.
    TripType:
      type: string
      enum: [ROUND_TRIP, ONE_WAY]
      description: ROUND_TRIP은 출발지 복귀, ONE_WAY는 다른 지점에서 종료합니다.
    ApiErrorResponse:
      type: object
      required: [code, message, fieldErrors]
      properties:
        code:
          type: string
          description: >-
            클라이언트 분기용 안정적인 오류 코드입니다. 예: INVALID_CANDIDATE_TOKEN,
            INVALID_REQUEST, ROUTE_API_RATE_LIMITED, ROUTE_API_BUSY,
            ROUTE_PROVIDER_UNAVAILABLE.
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
