plugins { id 'com.android.application' version '8.10.1' }

def releaseRouteApiBaseUrl = providers.gradleProperty('justGoRouteApiBaseUrl')
        .orElse(providers.environmentVariable('JUST_GO_ROUTE_API_BASE_URL'))
        .getOrElse('')
        .trim()
if (!releaseRouteApiBaseUrl.isEmpty() && !releaseRouteApiBaseUrl.startsWith('https://')) {
    throw new GradleException('Release 추천 서버 주소는 HTTPS여야 합니다.')
}
def quotedReleaseRouteApiBaseUrl = '"' + releaseRouteApiBaseUrl
        .replace('\\', '\\\\')
        .replace('"', '\\"') + '"'

android {
    namespace 'com.example.justgo'
    compileSdk 34
    useLibrary 'android.car'
    defaultConfig {
        applicationId 'com.example.justgo' // PROVISIONAL: 제출 전 고유 ID 확정
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '0.1'
        buildConfigField 'String', 'ROUTE_API_BASE_URL', '""'
    }
    buildTypes {
        debug {
            buildConfigField 'String', 'ROUTE_API_BASE_URL', '"http://10.0.2.2:18080"'
        }
        release {
            buildConfigField 'String', 'ROUTE_API_BASE_URL', quotedReleaseRouteApiBaseUrl
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'ai.pleos.playground:NaviHelper:3.0.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
