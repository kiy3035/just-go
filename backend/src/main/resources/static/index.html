<section class="controls" aria-labelledby="form-title">
<div class="panel">
<h2 id="form-title">오늘은 어떻게 달릴까요?</h2>
<form class="drive-form" id="drive-form">
<fieldset>
<legend>① 주행 방식</legend>
<div class="choice-grid two">
<div class="choice">
<input type="radio" name="tripType" id="roundTrip" value="왕복" checked>
<label for="roundTrip">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M20,8 A9,9 0,1 0,21 15 M20,2 L20,8 L14,8"/>
</svg>
<span class="choice-copy">
<strong>왕복</strong>
<small>출발지로 돌아오기</small>
</span>
</label>
</div>
<div class="choice">
<input type="radio" name="tripType" id="oneWay" value="편도">
<label for="oneWay">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M3,12 L21,12 M15,6 L21,12 L15,18"/>
</svg>
<span class="choice-copy">
<strong>편도</strong>
<small>새로운 곳으로</small>
</span>
</label>
</div>
</div>
</fieldset>
<fieldset>
<legend>② 드라이브 시간</legend>
<div class="choice-grid four">
<div class="choice">
<input type="radio" name="duration" id="duration30" value="30">
<label for="duration30">30분</label>
</div>
<div class="choice">
<input type="radio" name="duration" id="duration60" value="60" checked>
<label for="duration60">60분</label>
</div>
<div class="choice">
<input type="radio" name="duration" id="duration120" value="120">
<label for="duration120">120분</label>
</div>
<div class="choice">
<input type="radio" name="duration" id="durationCustom" value="custom">
<label for="durationCustom">직접 입력</label>
</div>
</div>
<div class="custom-time" id="custom-time">
<span>10~240분 · 5분 단위</span>
<label for="customMinutes">
<input type="number" id="customMinutes" min="10" max="240" step="5" value="90" inputmode="numeric" disabled required> 분</label>
</div>
<p class="time-hint" id="time-hint">출발지 복귀까지 · 체류 시간 제외</p>
</fieldset>
<fieldset>
<legend>③ 가고 싶은 곳</legend>
<div class="choice-grid theme-grid">
<div class="choice">
<input type="radio" name="theme" id="anywhere" value="어디든 좋아" checked>
<label for="anywhere">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M12,2 A10,10 0,1 0,12 22 A10,10 0,1 0,12 2 M16,8 L14,14 L8,16 L10,10 Z"/>
</svg>어디든 좋아</label>
</div>
<div class="choice">
<input type="radio" name="theme" id="city" value="도시">
<label for="city">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M3,21 L3,8 L10,8 L10,21 M10,21 L10,3 L21,3 L21,21 M1,21 L23,21 M6,11 L7,11 M6,15 L7,15 M14,7 L17,7 M14,11 L17,11 M14,15 L17,15"/>
</svg>도시</label>
</div>
<div class="choice">
<input type="radio" name="theme" id="mountain" value="산">
<label for="mountain">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M2,21 L10,4 L14,12 L17,8 L23,21 Z M7,10 L10,13 L12,10"/>
</svg>산</label>
</div>
<div class="choice">
<input type="radio" name="theme" id="sea" value="바다">
<label for="sea">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M2,8 C5,4 7,12 11,8 C15,4 18,12 22,8 M2,13 C5,9 7,17 11,13 C15,9 18,17 22,13 M2,18 C5,14 7,22 11,18 C15,14 18,22 22,18"/>
</svg>바다</label>
</div>
<div class="choice">
<input type="radio" name="theme" id="water" value="강/호수">
<label for="water">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M8,2 C1,7 17,9 9,14 C3,18 18,18 16,22 M14,2 C7,7 23,9 15,14 C9,18 24,18 22,22 M2,4 L4,4 M1,20 L5,20"/>
</svg>강/호수</label>
</div>
<div class="choice">
<input type="radio" name="theme" id="park" value="공원">
<label for="park">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M12,2 L5,10 L8,10 L3,16 L10,16 L10,21 M12,2 L19,10 L16,10 L21,16 L14,16 L14,21 M7,22 L17,22"/>
</svg>공원</label>
</div>
</div>
</fieldset>
<button type="submit" class="submit-button">

<span class="button-summary" hidden>
</span>
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M3,12 L21,12 M15,6 L21,12 L15,18"/>
</svg>
</button>
</form>
