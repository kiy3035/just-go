<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>그냥 고! — 드라이브 코스 선택</title>
<style>
:root { color-scheme:light; font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif; --ink:#183153; --muted:#526a85; --blue:#216adb; }
* { box-sizing:border-box; }
body { margin:0; min-width:320px; background:#fff; color:var(--ink); }
button,input { font:inherit; }
.shell { display:grid; grid-template-columns:minmax(280px,.36fr) minmax(0,.64fr); min-height:100vh; }
.visual { padding:36px; display:flex; flex-direction:column; background:linear-gradient(#e1edff,#f5f9ff); }
.brand { color:#1662cb; font-size:clamp(26px,2vw,36px); font-weight:850; }
.route-art { flex:1; display:grid; place-items:center; min-height:240px; }
.route-art svg { width:100%; max-width:480px; height:auto; }
.visual h1 { font-size:clamp(36px,3.2vw,64px); line-height:1.15; letter-spacing:-.055em; color:#123665; margin:24px 0; }
.visual p { font-size:clamp(18px,1.4vw,28px); line-height:1.5; color:var(--muted); }
.controls { display:flex; align-items:center; padding:48px; }
.panel { width:100%; max-width:1600px; margin:auto; }
h2 { margin:0 0 28px; color:#123665; font-size:clamp(30px,2.4vw,48px); letter-spacing:-.04em; }
.drive-form { display:grid; gap:24px; }
fieldset { margin:0; padding:0; border:0; min-width:0; }
legend { font-size:clamp(20px,1.5vw,30px); font-weight:800; margin-bottom:16px; }
.choice-grid { display:grid; gap:12px; }
.two { grid-template-columns:repeat(2,minmax(0,1fr)); }
.four { grid-template-columns:repeat(4,minmax(0,1fr)); }
.theme-grid { grid-template-columns:repeat(6,minmax(0,1fr)); }
.choice { position:relative; min-width:0; }
.choice input { position:absolute; opacity:0; width:1px; height:1px; }
.choice label { display:flex; align-items:center; justify-content:center; gap:12px; min-height:100px; padding:16px; background:#f3f7fc; border:2px solid #c7d7ec; border-radius:20px; color:#29415f; font-size:clamp(18px,1.6vw,32px); font-weight:750; cursor:pointer; text-align:center; }
.choice input:checked + label { background:#dcebff; border-color:var(--blue); color:#114c9f; }
.choice input:focus-visible + label { outline:3px solid #216adb; outline-offset:4px; }
.choice label:hover { border-color:var(--blue); }
.choice svg { width:36px; height:36px; flex-shrink:0; }
.theme-grid label { flex-direction:column; min-height:120px; }
.choice-copy { display:grid; gap:6px; }
.choice-copy small { font-size:.65em; font-weight:500; }
.time-hint { color:var(--muted); font-size:clamp(16px,1.2vw,24px); margin:14px 0 0; }
.custom-time { display:none; align-items:center; justify-content:space-between; gap:16px; margin-top:16px; color:var(--muted); }
.custom-time.is-visible { display:flex; }
.custom-time label { display:flex; align-items:center; gap:12px; color:var(--ink); font-size:32px; font-weight:750; }
.custom-time input { width:140px; min-height:72px; padding:12px; border:2px solid #c7d7ec; border-radius:12px; background:#fff; color:var(--ink); font-size:32px; font-weight:750; }
.submit-button { display:flex; align-items:center; justify-content:center; gap:16px; width:100%; min-height:92px; padding:20px; border:0; border-radius:20px; background:var(--blue); color:#fff; font-size:clamp(22px,1.7vw,34px); font-weight:800; cursor:pointer; }
.submit-button svg { width:28px; height:28px; }
.submit-button:hover { background:#1859bd; }
.submit-button:focus-visible { outline:3px solid #123665; outline-offset:4px; }
.selection-result { display:none; margin-top:24px; padding:24px; background:#eaf3ff; border-radius:20px; }
.selection-result.is-visible { display:block; }
.selection-result strong { font-size:24px; color:#1662cb; }
.selection-result p { margin:12px 0 0; font-size:clamp(24px,1.6vw,32px); }
@media(max-width:1100px) { .theme-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } .controls{padding:32px;} .visual{padding:24px;} .choice label{min-height:88px;} }
@media(max-width:760px) { .shell{grid-template-columns:1fr;} .visual{min-height:300px;position:relative;} .route-art{position:absolute;right:20px;top:36px;width:180px;opacity:.5;} .visual h1,.visual p,.brand{position:relative;z-index:1;} .visual h1{margin-top:40px;} .controls{padding:24px;} .two,.four{grid-template-columns:repeat(2,minmax(0,1fr));} .choice-copy small{font-size:14px;} }
@media(max-width:430px) { .two {grid-template-columns:1fr;} .theme-grid{grid-template-columns:repeat(2,minmax(0,1fr));} .custom-time{flex-wrap:wrap;} }
@media(prefers-reduced-motion:reduce) { *{scroll-behavior:auto!important;} }

/* Theme scenes are decorative; no simulated vehicle metrics are presented. */
body { background:#edf2f6; }
.shell { padding:16px; gap:16px; }
.visual { position:relative; isolation:isolate; padding:36px; border-radius:28px; overflow:hidden; background:#82b8e2; }
.drive-scene { position:absolute; inset:0; width:100%; height:100%; z-index:-1; }
.brand { color:white; font-weight:600; }
.scene-copy { margin-top:auto; padding-top:480px; }
.visual h1 { color:white; font-weight:500; font-size:clamp(36px,3.2vw,64px); margin:0 0 20px; }
.visual p { color:#f2f8f6; margin:0; font-size:clamp(18px,1.4vw,28px); }
.controls { background:white; border-radius:28px; }
.four { padding:6px; gap:4px; background:#f0f3f8; border-radius:18px; }
.four .choice label { border:0; min-height:80px; background:transparent; border-radius:14px; font-weight:500; }
.four .choice input:checked + label { background:white; color:#16223c; font-weight:800; box-shadow:0 2px 6px #182b4412; }
.submit-button { background:#16223c; }
.submit-button:hover { background:#243551; }
.drive-scene [data-scene] { display:none; }
.drive-scene[data-theme="anywhere"] [data-scene="anywhere"] { display:block; }
.drive-scene[data-theme="city"] [data-scene="city"] { display:block; }
.drive-scene[data-theme="mountain"] [data-scene="mountain"] { display:block; }
.drive-scene[data-theme="sea"] [data-scene="sea"] { display:block; }
.drive-scene[data-theme="water"] [data-scene="water"] { display:block; }
.drive-scene[data-theme="park"] [data-scene="park"] { display:block; }
.drive-scene[data-theme="city"] .road-surface { fill:#34465f; }
.drive-scene[data-theme="city"] .foreground { fill:#42516b; }
.drive-scene[data-theme="city"] .foreground-bushes { display:none; }
.moving-road { animation:road-travel 2s linear infinite; }
.scenic-car { animation:car-drift 24s linear infinite; }
.car-suspension { animation:car-bob 3s ease-in-out infinite; }
.car-wheel { transform-box:fill-box; transform-origin:center; animation:wheel-spin 2s linear infinite; }
@keyframes road-travel { to { transform:translateX(-60px); } }
@keyframes car-drift { 0%,50%,100% { transform:translateX(0); } 25% { transform:translateX(34px); } 75% { transform:translateX(-34px); } }
@keyframes car-bob { 50% { transform:translateY(.8px); } }
@keyframes wheel-spin { to { transform:rotate(360deg); } }
@media(max-width:760px) { .shell {padding:12px;gap:12px;} .visual {min-height:580px;} .scene-copy{padding-top:340px;} .controls{padding:24px;} .visual h1 {font-size:40px;} }
@media(prefers-reduced-motion:reduce) { .moving-road,.scenic-car,.car-suspension,.car-wheel{animation:none!important;} }

.theme-grid .choice label { font-size:clamp(18px,1.35vw,28px); padding-inline:10px; word-break:keep-all; height:100%; }

.scene-copy { position:absolute; top:15%; left:36px; right:36px; margin:0; padding:0; }
.visual h1 { font-weight:500; text-shadow:0 2px 7px #4460849b; }
.visual .scene-subtitle { position:absolute; bottom:36px; left:36px; right:36px; }
@media(max-width:760px) { .is-searching .button-summary { order:3; flex-basis:100%; } .is-searching { flex-wrap:wrap; } }
.submit-button { justify-content:flex-start; text-align:left; }
.submit-button svg { margin-left:auto; flex-shrink:0; }
.submit-button.is-searching { background:#216adb; }
.submit-button.is-searching:disabled { opacity:1; cursor:wait; }
.button-summary { font-size:.65em; font-weight:500; color:#d8e8ff; }
@media(max-width:760px) { .scene-copy {top:16%;left:24px;right:24px;} .scene-subtitle {bottom:24px;left:24px;right:24px;} .scene-copy h1{margin-top:0;} }
.visual .brand { font-size:clamp(34px,2.5vw,48px); font-weight:750; }
.submit-button { min-height:108px; padding:26px 24px; margin-top:12px; margin-bottom:12px; }
.coastal-rail { display:none; }
.drive-scene[data-theme="sea"] .coastal-rail { display:block; }
.drive-scene[data-theme="sea"] .road-surface { fill:#2D485F; }
.drive-scene[data-theme="sea"] .foreground { fill:#708C9C; }
.drive-scene[data-theme="sea"] .foreground-bushes { display:none; }
.drive-scene[data-theme="city"] .foreground-verge { display:none; }
.drive-scene[data-theme="sea"] .verge-back { fill:#78939B; }
.drive-scene[data-theme="sea"] .verge-front { fill:#5D7E89; }
.drive-scene[data-theme="sea"] .verge-grass { stroke:#426976; }
.drive-scene[data-theme="sea"] #scene-shade stop:last-child { stop-color:#1F2C42; }
</style>
</head>

<div class="choice"><input type="radio" name="theme" id="sea" value="바다"><label for="sea"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2,8 C5,4 7,12 11,8 C15,4 18,12 22,8 M2,13 C5,9 7,17 11,13 C15,9 18,17 22,13 M2,18 C5,14 7,22 11,18 C15,14 18,22 22,18"/></svg>바다</label></div>
<div class="choice"><input type="radio" name="theme" id="water" value="강/호수"><label for="water"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8,2 C1,7 17,9 9,14 C3,18 18,18 16,22 M14,2 C7,7 23,9 15,14 C9,18 24,18 22,22 M2,4 L4,4 M1,20 L5,20"/></svg>강/호수</label></div>
<div class="choice"><input type="radio" name="theme" id="park" value="공원"><label for="park"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12,2 L5,10 L8,10 L3,16 L10,16 L10,21 M12,2 L19,10 L16,10 L21,16 L14,16 L14,21 M7,22 L17,22"/></svg>공원</label></div>
</div></fieldset>
<button type="submit" class="submit-button">이 조건으로 코스 찾기 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3,12 L21,12 M15,6 L21,12 L15,18"/></svg></button>
</form>
<section class="selection-result" id="selection-result" aria-live="polite"><strong>선택한 조건</strong><p id="selection-summary"></p></section>
</div></section></main>
<script>
const form = document.querySelector('#drive-form');
const scene = document.querySelector('.drive-scene');
const customTime = document.querySelector('#custom-time');
const customMinutes = document.querySelector('#customMinutes');
const result = document.querySelector('#selection-result');
const summary = document.querySelector('#selection-summary');
const searchButton = document.querySelector('.submit-button');
const originalButton = searchButton.innerHTML;
let searchTimer;
form.addEventListener('change', () => {
    scene.dataset.theme = form.querySelector('input[name="theme"]:checked').id;
    const custom = form.elements.duration.value === 'custom';
    customTime.classList.toggle('is-visible', custom);
    customMinutes.disabled = !custom;
    document.querySelector('#time-hint').textContent =
        (form.elements.tripType.value === '왕복' ? '출발지 복귀' : '목적지 도착') + '까지 · 체류 시간 제외';
});
form.addEventListener('submit', event => {
    event.preventDefault();
    const minutes = Number(form.elements.duration.value === 'custom' ? customMinutes.value : form.elements.duration.value);
    if (!Number.isInteger(minutes) || minutes < 10 || minutes > 240 || minutes % 5 !== 0) {
        customMinutes.reportValidity();
        return;
    }
    // 선택 조건 확인만 수행하며 위치 조회나 경로 API 호출은 하지 않는다.
    summary.textContent = form.elements.tripType.value + ' · ' + minutes + '분 · ' + form.elements.theme.value;
    result.classList.remove('is-visible');
    clearTimeout(searchTimer);
    searchButton.classList.add('is-searching');
    searchButton.disabled = true;
    searchButton.setAttribute('aria-busy', 'true');
    searchButton.replaceChildren();
    const loadingTitle = document.createElement('span');
    loadingTitle.textContent = '좋은 길을 찾고 있어요…';
    const details = document.createElement('span');
    details.className = 'button-summary';
    details.textContent = summary.textContent;
    const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    arrow.setAttribute('viewBox','0 0 24 24');
    arrow.setAttribute('fill','none');
    arrow.setAttribute('stroke','currentColor');
    arrow.setAttribute('stroke-width','2');
    arrow.setAttribute('aria-hidden','true');
    const arrowPath = document.createElementNS('http://www.w3.org/2000/svg','path');
    arrowPath.setAttribute('d','M3 12H21M15 6L21 12L15 18');
    arrow.append(arrowPath);
    searchButton.append(loadingTitle, details, arrow);
    // Local UI feedback only; no route API is called.
    searchTimer = setTimeout(() => {
        searchButton.innerHTML = originalButton;
        searchButton.classList.remove('is-searching');
        searchButton.disabled = false;
        searchButton.removeAttribute('aria-busy');
        result.classList.add('is-visible');
    }, 1800);
});
</script>
</body>
</html>
