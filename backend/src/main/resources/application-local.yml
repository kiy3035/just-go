spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/justgo}
    username: ${DB_USERNAME:justgo}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration

# 로컬 시연은 loopback으로만 열리므로 여러 테마를 연속 확인할 수 있게 완화합니다.
# public/local 프로필이 없는 공개 환경은 application.yml의 보수적인 기본값 4를 유지합니다.
justgo:
  security:
    route-api:
      requests-per-minute: ${ROUTE_API_REQUESTS_PER_MINUTE:60}
