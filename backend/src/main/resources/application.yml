spring:
  application:
    name: just-go-backend
  config:
    import: optional:file:.env[.properties]

justgo:
  recommendation:
    allowed-underrun-percent: ${ROUTE_ALLOWED_UNDERRUN_PERCENT:20}
    allowed-overrun-percent: ${ROUTE_ALLOWED_OVERRUN_PERCENT:15}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
